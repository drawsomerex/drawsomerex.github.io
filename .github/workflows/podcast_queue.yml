name: Scheduled Podcast Publisher

on:
  schedule:
    # 15:02 UTC corresponds to 10:02 AM US Central Time (offset to avoid top-of-hour congestion)
    - cron: '2 15 * * *'
    # Regular 15-minute fallback checks
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process Queued Episodes
        run: |
          python3 scripts/process_podcast_queue.py

      - name: Commit & Push Changes to Main
        if: env.EPISODES_PUBLISHED == 'true'
        run: |
          git config user.name "Autonomous Podcast Publisher"
          git config user.email "autonomousmedialab@gmail.com"
          git add src/site/podcasts/
          git commit -m "Publish scheduled podcast episodes"
          git push origin main

      - name: Setup Node for Pages Build
        if: env.EPISODES_PUBLISHED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Static Site
        if: env.EPISODES_PUBLISHED == 'true'
        run: |
          npm ci
          npm run build --if-present

      - name: Deploy to GitHub Pages
        if: env.EPISODES_PUBLISHED == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
