name: Scheduled Podcast Publisher

on:
  schedule:
    # 15:00 UTC corresponds to 10:00 AM US Central Time
    - cron: '0 15 * * *'
    # Hourly check to catch any scheduled drops
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process Queued Episodes
        run: |
          python3 scripts/process_podcast_queue.py

      - name: Commit & Push Changes
        if: env.EPISODES_PUBLISHED == 'true'
        run: |
          git config user.name "Autonomous Podcast Publisher"
          git config user.email "broadcast@synthetic.media"
          git add src/site/podcasts/
          git commit -m "Publish scheduled podcast episodes"
          git push origin main
